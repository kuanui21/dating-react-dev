<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        var REPO_NAME = '/dating-react-dev';
        var currentPathname = window.location.pathname;

        // 移除所有重複的 REPO_NAME 前綴
        while (targetPathname.startsWith(REPO_NAME + REPO_NAME)) {
            targetPathname = targetPathname.substring(REPO_NAME.length);
        }

        var redirectUrl = window.location.protocol + '//' + window.location.host + targetPathname;

        // 步驟 3: 只有當目標 URL 與當前 URL 不同時才進行重定向，防止無限迴圈
        if (currentPathname !== targetPathname) {
            window.location.replace(redirectUrl);
        }
    </script>
</head>

<body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, follow this <a id="redirectLink" href="#">link</a>.</p>
    <script type="text/javascript">
        document.getElementById('redirectLink').href = redirectUrl;
    </script>
</body>

</html>
