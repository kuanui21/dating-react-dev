<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        var REPO_NAME = '/dating-react-dev';
        var currentPath = window.location.pathname;
        var hash = window.location.hash;
        
        // GitHub Pages SPA 重定向邏輯
        function handleSPARedirect() {
            var targetPath;

            // 如果已經在正確的基礎路徑下，直接跳轉到 React 應用
            if (currentPath.startsWith(REPO_NAME + '/') || currentPath === REPO_NAME) {
                targetPath = currentPath;
            } else {
                // 如果是根路徑，重定向到基礎路徑
                if (currentPath === '/' || currentPath === '') {
                    targetPath = REPO_NAME + '/';
                } else {
                    // 其他情況：將當前路徑附加到基礎路徑後
                    // 移除開頭的 / 避免雙斜線
                    var cleanPath = currentPath.startsWith('/') ? currentPath.substring(1) : currentPath;
                    targetPath = REPO_NAME + '/' + cleanPath;
                }
            }

            // 構建最終 URL
            var redirectUrl = window.location.origin + targetPath + hash;

            console.log('Redirecting to:', redirectUrl);

            // 立即重定向到 React 應用
            window.location.replace(redirectUrl);
        }

        // 執行重定向
        handleSPARedirect();
    </script>
</head>

<body>
    <h1>重定向中...</h1>
    <p>如果頁面沒有自動跳轉，請點擊 <a id="redirectLink" href="#">此連結</a>。</p>
    <script type="text/javascript">
        // 設定手動連結
        var manualRedirectUrl = window.location.origin + REPO_NAME + '/';
        document.getElementById('redirectLink').href = manualRedirectUrl;

        // 如果 2 秒後還沒跳轉，顯示錯誤訊息
        setTimeout(function () {
            if (document.body) {
                var errorMsg = document.createElement('p');
                errorMsg.innerHTML = '自動跳轉失敗，請手動點擊上方連結，或 <a href="' + manualRedirectUrl + '">點擊這裡</a> 回到首頁。';
                errorMsg.style.color = 'red';
                errorMsg.style.marginTop = '20px';
                document.body.appendChild(errorMsg);
            }
        }, 2000);
    </script>
</body>

</html>
